name: "E2E"

# ONE-OFF PROBE, NOT FOR MERGING. Replaces the E2E for one run on this branch.
# Question: does Firehose still write its delivery errors into /aws/kinesisfirehose/better-stack-{logs,metrics} when
# better-stack-firehose-role has no logs:CreateLogGroup?
# The stack is deployed from this checkout with a source token ingest does not know and with retries off, so every
# Firehose batch is rejected. The metric stream feeds better-stack-metrics by itself; better-stack-logs gets
# hand-made CloudWatch Logs subscription records. The run passes when both DestinationDelivery log streams hold an
# error event written by Firehose.

on:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

# The template names its IAM roles and buckets globally, so one stack per account at a time.
concurrency:
  group: e2e-aws-stack
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::251917137055:role/github-actions-e2e
  API: https://telemetry.betterstack.com
  RUN_ID: gh${{ github.run_id }}a${{ github.run_attempt }}
  SOURCE_PREFIX: e2e-aws-stack
  STACK_NAME: e2e-gh${{ github.run_id }}a${{ github.run_attempt }}
  TEST_TEAM_TELEMETRY_API: ${{ secrets.TEST_TEAM_TELEMETRY_API }}

jobs:
  build-lambdas:
    name: Build the Lambdas
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: lambda/.cache
          key: lambda-build-${{ hashFiles('lambda/Cargo.lock') }}

      - name: Build the Lambda zips
        run: lambda/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: lambda-zips
          path: lambda/dist/*.zip
          retention-days: 7

  test:
    name: Firehose delivery error probe
    needs: [build-lambdas]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: "[Setup] Checkout code"
        uses: actions/checkout@v7

      - name: "[Setup] Take the template from this checkout"
        run: |
          cp cloudformation/full/better-stack-full.yaml template.yaml
          echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          mkdir -p out

      - name: "[Setup] AWS credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: "[Setup] Sweep leftovers of earlier runs"
        run: bash e2e/cleanup.sh

      # The source only provides a real ClusterId and SourceId; its token never reaches the stack.
      - name: "[Setup] Create AWS source"
        run: |
          RES=$(curl -sS -X POST "$API/api/v1/sources" -H "Authorization: Bearer $TEST_TEAM_TELEMETRY_API" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg name "$SOURCE_PREFIX $RUN_ID" '{name: $name, platform: "aws"}')")
          jq -e '.data.id' <<<"$RES" >/dev/null || { echo "::error::creating the source failed: $RES"; exit 1; }
          echo "::add-mask::$(jq -r '.data.attributes.token' <<<"$RES")"
          {
            echo "SOURCE_ID=$(jq -r '.data.id' <<<"$RES")"
            echo "DATA_REGION=$(jq -r '.data.attributes.data_region' <<<"$RES")"
            echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
          } >> "$GITHUB_ENV"
          echo "source $(jq -r '.data.id' <<<"$RES") on $(jq -r '.data.attributes.data_region' <<<"$RES")"

      - name: "[Setup] Download the Lambdas built from the checkout"
        uses: actions/download-artifact@v8
        with:
          name: lambda-zips
          path: lambda-zips

      - name: "[Setup] Upload the Lambdas built from the checkout and point the template at them"
        run: |
          BUCKET="better-stack-e2e-lambda-code-$ACCOUNT_ID-$AWS_REGION"
          aws s3 mb "s3://$BUCKET" >/dev/null
          aws s3 cp lambda-zips/ "s3://$BUCKET/$RUN_ID/" --recursive --exclude '*' --include '*.zip'
          sed -i -e "s|better-stack-lambda-\${AWS::Region}|$BUCKET|g" -e "s/^      Version: 0\.0\.0-dev$/      Version: $RUN_ID/" template.yaml
          grep -q "$BUCKET" template.yaml && grep -q "^      Version: $RUN_ID$" template.yaml || { echo "::error::the template no longer names better-stack-lambda-\${AWS::Region} or 'Version: 0.0.0-dev'"; exit 1; }

      - name: "[Probe] Deploy the stack with a source token ingest does not know, retries off"
        run: |
          aws cloudformation create-stack --stack-name "$STACK_NAME" --template-body file://template.yaml --capabilities CAPABILITY_NAMED_IAM \
            --parameters "ParameterKey=ClusterId,ParameterValue=$DATA_REGION" "ParameterKey=SourceToken,ParameterValue=invalid-probe-$RUN_ID" "ParameterKey=SourceId,ParameterValue=$SOURCE_ID" "ParameterKey=FirehoseRetryDurationSeconds,ParameterValue=0"
          if ! aws cloudformation wait stack-create-complete --stack-name "$STACK_NAME"; then
            echo "::error::stack creation failed: $(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text)"
            aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --query "StackEvents[?ends_with(ResourceStatus, 'FAILED')].[LogicalResourceId,ResourceStatus,ResourceStatusReason]" --output table
            exit 1
          fi

      - name: "[Probe] better-stack-firehose-role has no logs:CreateLogGroup"
        run: |
          ROLE=better-stack-firehose-role
          echo "attached managed policies: $(aws iam list-attached-role-policies --role-name "$ROLE" --query 'AttachedPolicies[].PolicyName' --output text)"
          for policy in $(aws iam list-role-policies --role-name "$ROLE" --query 'PolicyNames[]' --output text); do
            aws iam get-role-policy --role-name "$ROLE" --policy-name "$policy" --query 'PolicyDocument' --output json
          done > role-policies.json
          LOGS_ACTIONS=$(jq -s -c '[.[].Statement[] | .Action | if type == "array" then .[] else . end | select(startswith("logs:") or . == "*")] | unique' role-policies.json)
          echo "logs actions of $ROLE: $LOGS_ACTIONS"
          jq -e 'index("logs:CreateLogGroup") == null and index("logs:*") == null and index("*") == null' <<<"$LOGS_ACTIONS" >/dev/null || { echo "::error::$ROLE can create log groups, this run proves nothing"; exit 1; }
          { echo "### Firehose delivery error probe \`$RUN_ID\`"; echo; echo "\`$ROLE\` logs actions: \`$LOGS_ACTIONS\`"; echo; } >> out/probe.md

      - name: "[Probe] Firehose writes its delivery errors into both DestinationDelivery log streams"
        run: |
          put_logs_record() {
            DATA=$(jq -nc --arg owner "$ACCOUNT_ID" --arg run "$RUN_ID" '{messageType: "DATA_MESSAGE", owner: $owner, logGroup: ("/e2e/" + $run), logStream: "probe", subscriptionFilters: ["probe"], logEvents: [{id: "1", timestamp: (now * 1000 | floor), message: ("firehose delivery error probe " + $run)}]}' | gzip -c | base64 -w0)
            aws firehose put-record --delivery-stream-name better-stack-logs --record "Data=$DATA" --query RecordId --output text >/dev/null
          }
          DEADLINE=$((SECONDS + 900))
          while :; do
            put_logs_record
            EMPTY=""
            for stream in better-stack-logs better-stack-metrics; do
              aws logs get-log-events --log-group-name "/aws/kinesisfirehose/$stream" --log-stream-name DestinationDelivery --start-from-head --limit 3 --query 'events[].message' --output json > "errors-$stream.json"
              [ "$(jq length "errors-$stream.json")" -gt 0 ] || EMPTY="$EMPTY $stream"
            done
            [ -z "$EMPTY" ] && break
            [ "$SECONDS" -lt "$DEADLINE" ] || break
            echo "no error event yet in:$EMPTY"; sleep 30
          done
          for stream in better-stack-logs better-stack-metrics; do
            echo "== /aws/kinesisfirehose/$stream DestinationDelivery, after $SECONDS s"
            jq -r '.[]' "errors-$stream.json"
            { echo "**/aws/kinesisfirehose/$stream** \`DestinationDelivery\`, first events:"; echo; echo '```'; jq -r '.[]' "errors-$stream.json"; echo '```'; echo; } >> out/probe.md
          done
          echo "== failed records in the backup bucket"
          aws s3 ls "s3://better-stack-firehose-$ACCOUNT_ID-$AWS_REGION/" --recursive | head -20 || true
          if [ -n "$EMPTY" ]; then
            echo "::error::Firehose wrote no error event within 15 min into:$EMPTY"
            echo "❌ No error event within 15 min in:$EMPTY" >> out/probe.md
            exit 1
          fi
          echo "✅ Firehose wrote its delivery errors into both log groups." >> out/probe.md

      # Informational: who called CreateLogGroup since the run started, and with what result. CloudTrail's event
      # history lags by several minutes, so the newest calls may be missing.
      - name: "[Probe] CreateLogGroup calls in CloudTrail since the run started"
        if: always()
        continue-on-error: true
        run: |
          sleep 300
          aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=CreateLogGroup --start-time "$RUN_STARTED" --query 'Events[].CloudTrailEvent' --output json \
            | jq -r '.[] | fromjson | "\(.eventTime) \(.userIdentity.arn // .userIdentity.invokedBy) \(.requestParameters.logGroupName) \(.errorCode // "ok")"' | sort | tee cloudtrail.txt
          { echo; echo "**CreateLogGroup calls since $RUN_STARTED (CloudTrail)**"; echo; echo '```'; cat cloudtrail.txt; echo '```'; } >> out/probe.md

      - name: "[Cleanup] Delete this run's resources in Better Stack and AWS"
        if: always()
        run: |
          [ ! -f out/probe.md ] || cp out/probe.md probe.md
          bash e2e/cleanup.sh

      - name: "[Report] Job summary"
        if: always()
        run: |
          [ ! -f probe.md ] || cat probe.md >> "$GITHUB_STEP_SUMMARY"
          [ ! -f out/cleanup.md ] || { echo; cat out/cleanup.md; } >> "$GITHUB_STEP_SUMMARY"
