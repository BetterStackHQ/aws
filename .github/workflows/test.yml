name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            lambda/target
          key: cargo-test-${{ hashFiles('lambda/Cargo.lock') }}

      - name: Run tests
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --check
