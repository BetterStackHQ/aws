name: "Notify Linear on failure"

# A caller that sets neither input gets the plain issue: "E2E failure: <workflow name>" listing the failed jobs and steps.
on:
  workflow_call:
    inputs:
      test_name:
        description: "Names the test in the issue title instead of the workflow name"
        type: string
        default: ""
      job_summaries:
        description: >-
          Adds each failed job's errors and summary to the issue. A job hands its summary over as an artifact named
          "e2e-summary-<job name>" holding summary.md.
        type: boolean
        default: false

jobs:
  create-linear-issue:
    runs-on: ubuntu-latest
    # A caller must grant checks: read as well (the errors come from the annotations), or this job cannot start.
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: "Gather failure context"
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || github.run_attempt }}
          JOB_SUMMARIES: ${{ inputs.job_summaries }}
        run: |
          JOBS=$(gh api \
            "repos/${{ github.repository }}/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --paginate \
            --jq '.jobs[]
                    | select(.conclusion == "failure")
                    | {id, name, steps: ([.steps[] | select(.conclusion == "failure") | .name] | join(", "))}
                    | @json')

          FAILED=""
          while read -r job; do
            [ -n "$job" ] || continue
            NAME=$(jq -r .name <<<"$job")
            STEPS=$(jq -r .steps <<<"$job")
            if [ "$JOB_SUMMARIES" != true ]; then
              FAILED="$FAILED- **$NAME** — failed at _${STEPS}_"$'\n'
              continue
            fi
            # The job's ::error:: lines, without the runner's closing "Process completed with exit code 1."
            ERRORS=$(gh api "repos/${{ github.repository }}/check-runs/$(jq -r .id <<<"$job")/annotations" \
              --jq '.[] | select(.annotation_level == "failure" and (.message | startswith("Process completed with exit code") | not)) | "- \(.message | gsub("\n"; " "))"') || ERRORS=""
            FAILED="$FAILED### $NAME"$'\n\n'"Failed at **${STEPS}**"$'\n\n'"${ERRORS:+$ERRORS$'\n\n'}"
            # A job that failed before writing its summary has no artifact and gets the errors alone.
            SUMMARY_DIR="summaries/$(jq -r .id <<<"$job")"
            gh run download "$RUN_ID" -R "${{ github.repository }}" -n "e2e-summary-$NAME" -D "$SUMMARY_DIR" >/dev/null 2>&1 || true
            [ ! -f "$SUMMARY_DIR/summary.md" ] || FAILED="$FAILED$(cat "$SUMMARY_DIR/summary.md")"$'\n\n'
          done <<<"$JOBS"

          while [[ "$FAILED" == *$'\n' ]]; do FAILED="${FAILED%$'\n'}"; done
          if [ -z "$FAILED" ]; then
            FAILED="_(no failed jobs reported by the API yet)_"
          elif [ "${#FAILED}" -gt 20000 ]; then
            FAILED="${FAILED:0:20000}"$'\n\n'"_(cut at 20,000 characters, the rest is in the run)_"
          fi

          {
            echo "failed_jobs<<CTXEOF"
            echo "$FAILED"
            echo "CTXEOF"
          } >> "$GITHUB_OUTPUT"
      - name: "Create Linear issue"
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_TELEMETRY_ID }}
          LINEAR_STATUS_PLAN_ID: ${{ secrets.LINEAR_STATUS_PLAN_ID }}
          LINEAR_PROJECT_INGESTION_FOR_EVERYTHING_ID: ${{ secrets.LINEAR_PROJECT_INGESTION_FOR_EVERYTHING_ID }}
          LINEAR_ASSIGNEE_PETR_ID: ${{ secrets.LINEAR_ASSIGNEE_PETR_ID }}
          WORKFLOW: ${{ inputs.test_name || github.event.workflow_run.name || github.workflow }}
          REF_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || github.run_attempt }}
          EVENT_NAME: ${{ github.event.workflow_run.event || github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message }}
          FAILED_JOBS: ${{ steps.ctx.outputs.failed_jobs }}
        run: |
          SHORT_SHA="${SHA:0:7}"

          # head_commit is only populated on push events; skip the line otherwise
          COMMIT_LINE="**Commit:** \`$SHORT_SHA\`"
          if [ -n "$COMMIT_MESSAGE" ]; then
            COMMIT_SUBJECT="$(printf '%s' "$COMMIT_MESSAGE" | head -n1)"
            COMMIT_LINE="**Commit:** \`$SHORT_SHA\` — $COMMIT_SUBJECT"
          fi

          ATTEMPT_NOTE=""
          if [ "$RUN_ATTEMPT" != "1" ]; then
            ATTEMPT_NOTE=" (attempt #$RUN_ATTEMPT)"
          fi

          TITLE="E2E failure: $WORKFLOW"
          DESCRIPTION=$(cat <<EOF
          **$WORKFLOW** failed on \`$REF_NAME\` via \`$EVENT_NAME\`$ATTEMPT_NOTE

          **Failing jobs:**
          $FAILED_JOBS

          $COMMIT_LINE

          [View failing run]($RUN_URL)
          EOF
          )

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg teamId "$LINEAR_TEAM_ID" \
            --arg assigneeId "$LINEAR_ASSIGNEE_PETR_ID" \
            --arg stateId "$LINEAR_STATUS_PLAN_ID" \
            --arg projectId "$LINEAR_PROJECT_INGESTION_FOR_EVERYTHING_ID" \
            '{
              query: "mutation IssueCreate($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }",
              variables: {
                input: {
                  title: $title,
                  description: $description,
                  teamId: $teamId,
                  assigneeId: $assigneeId,
                  stateId: $stateId,
                  projectId: $projectId,
                  priority: 2
                }
              }
            }')

          curl -sSf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
