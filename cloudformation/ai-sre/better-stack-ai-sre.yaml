AWSTemplateFormatVersion: '2010-09-09'
Description: Better Stack AI SRE - a read-only role Better Stack assumes to investigate incidents

# Template contract. Better Stack, every setup link already sent, stacks updated in place with "Update stack" and
# roles rebuilt from this file in other tools all depend on the following, so no release may break it:
#   - Parameters are only ever added, always with a default. None is renamed or removed.
#   - The RoleName expression and the ExternalId pattern never change: a different role name would make an in-place
#     update replace the role with one Better Stack does not know.
#   - The tag key BetterStackAiSreTemplateVersion never changes.
#   - The trust is two statements: sts:AssumeRole with the external ID and the callers' path conditions, and
#     sts:SetSourceIdentity with the callers' path and a source identity starting bs-. No other sts action is added.
#   - Better Stack's role session names start with BetterStackAiSre-, and always will.
#   - Better Stack's source identity values start with bs-, and always will.
#   - The deny policies better-stack-ai-sre-deny-data-<8 hex> and better-stack-ai-sre-deny-stored-data-<8 hex> keep
#     their names and stay attached to the role in both settings.
# The "latest" copy of this file is fetched when the console opens a setup link and again when the stack is created,
# so a release that renamed or removed a parameter a link passes, or added one without a default, would fail creates.
# cloudformation/ai-sre/contract.json records these fields and CI (cloudformation/ai-sre/test/) checks every change
# against it.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Better Stack configuration
        Parameters:
          - ExternalId
          - BetterStackTeam
          - BetterStackEnvironment
      - Label:
          default: Options
        Parameters:
          - AllowConfigurationValues
          - PermissionsBoundaryArn
    ParameterLabels:
      ExternalId:
        default: External ID (set by Better Stack, don't change)
      BetterStackTeam:
        default: Better Stack team that gets access (set by Better Stack, don't change)
      BetterStackEnvironment:
        default: Better Stack environment (set by Better Stack, don't change)
      AllowConfigurationValues:
        default: Broad read access, including environment variables and other configuration values
      PermissionsBoundaryArn:
        default: Permissions boundary ARN (optional)

Parameters:
  ExternalId:
    Type: String
    Description: Generated by Better Stack for this integration. Don't change it.
    AllowedPattern: '^bs-ai-sre-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    ConstraintDescription: must be the external ID Better Stack generated, bs-ai-sre- followed by a lowercase UUID

  BetterStackTeam:
    Type: String
    Default: ''
    Description: The Better Stack team and organization that get read access. Check it is yours.
    AllowedPattern: '^[A-Za-z0-9 ._()-]{0,128}$'
    ConstraintDescription: at most 128 letters, digits, spaces and . _ ( ) -

  BetterStackEnvironment:
    Type: String
    Description: Which Better Stack environment may use the role. Every value names Better Stack's own account.
    Default: production
    AllowedValues:
      - production
      - staging
      - development

  AllowConfigurationValues:
    Type: String
    Description: >-
      When true, the role gets AWS's ReadOnlyAccess policy, with secrets, credentials and stored data denied. When
      false, it gets a fixed, shorter list of reads and denies every read Better Stack knows returns environment
      variables, user data or parameter values.
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  PermissionsBoundaryArn:
    Type: String
    Description: Optional. A permissions boundary your organization requires on new roles.
    Default: ''

Mappings:
  # Stamped by the Release workflow, as in better-stack-full.yaml; the role carries it as its version tag.
  Release:
    Current:
      Version: 0.0.0-dev

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]
  DenyConfigurationValues: !Equals [!Ref AllowConfigurationValues, 'false']
  HasBetterStackTeam: !Not [!Equals [!Ref BetterStackTeam, '']]

Resources:
  AiSreRole:
    Type: AWS::IAM::Role
    Properties:
      # better-stack-ai-sre-role-<first 8 hex of the external ID's UUID>; Better Stack derives the same name. Never
      # change this expression.
      RoleName: !Join ['', ['better-stack-ai-sre-role-', !Select [3, !Split ['-', !Ref ExternalId]]]]
      Description: !If
        - HasBetterStackTeam
        - !Sub 'Read-only access for Better Stack AI SRE. Team: ${BetterStackTeam}'
        - Read-only access for Better Stack AI SRE.
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      # AWS's ReadOnlyAccess in the default setting only. AWS extends it as it adds services; the denies still apply to
      # everything it grants.
      ManagedPolicyArns:
        # The explicit denies, in both settings, so that ReadOnlyAccess or a broader policy attached to the role later
        # can't widen it to secrets or data. They are managed policies of this stack because the role's inline
        # policies can't hold them all.
        - !Ref AiSreDenyDataPolicy
        - !Ref AiSreDenyStoredDataPolicy
        - !If
          - DenyConfigurationValues
          - !Ref 'AWS::NoValue'
          - !Sub 'arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Two statements. sts:AssumeRole only with the external ID and only from Better Stack's AI SRE callers for
          # the chosen environment; sts:SetSourceIdentity from the same callers, for a bs- value only. AWS refuses
          # SetSourceIdentity in a statement that also requires sts:ExternalId. Never add another sts action.
          - Sid: AssumeWithExternalId
            Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::476114145753:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
              ArnLike:
                aws:PrincipalArn: !Sub 'arn:aws:iam::476114145753:*/better-stack-ai-sre/${BetterStackEnvironment}/*'
          - Sid: SetSourceIdentity
            Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::476114145753:root'
            Action: sts:SetSourceIdentity
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub 'arn:aws:iam::476114145753:*/better-stack-ai-sre/${BetterStackEnvironment}/*'
              StringLike:
                sts:SourceIdentity: 'bs-*'
      Policies:
        # Needed in both settings: the role's own policies, encrypted log groups, and the token for AWS's MCP Server.
        - PolicyName: BetterStackAiSreCoreAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The role's own version tag and policies, and nothing about any other role.
              - Sid: SelfRead
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                Resource: !Join ['', ['arn:', !Ref 'AWS::Partition', ':iam::', !Ref 'AWS::AccountId', ':role/better-stack-ai-sre-role-', !Select [3, !Split ['-', !Ref ExternalId]]]]
              # The stack's own deny policies, and no other policy.
              - Sid: SelfReadDenyPolicies
                Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                Resource:
                  - !Ref AiSreDenyDataPolicy
                  - !Ref AiSreDenyStoredDataPolicy
              # Log groups encrypted with a customer managed key, read through CloudWatch Logs only.
              - Sid: EncryptedLogs
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: '*'
                Condition:
                  StringLike:
                    kms:ViaService: logs.*.amazonaws.com
              # The token for AWS's MCP Server.
              - Sid: McpToken
                Effect: Allow
                Action:
                  - signin:CreateOAuth2Token
                Resource: 'arn:aws:signin:*:*:service-principal/aws-mcp.amazonaws.com'
        # The curated read list, the whole of what the role reads with AllowConfigurationValues=false. With true,
        # ReadOnlyAccess grants these reads and more.
        - !If
          - DenyConfigurationValues
          - PolicyName: BetterStackAiSreReadAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: CloudWatchRead
                  Effect: Allow
                  Action:
                    - cloudwatch:Describe*
                    - cloudwatch:Get*
                    - cloudwatch:List*
                  Resource: '*'
                - Sid: LogsRead
                  Effect: Allow
                  Action:
                    - logs:Describe*
                    - logs:Get*
                    - logs:List*
                    - logs:FilterLogEvents
                  Resource: '*'
                - Sid: EC2Read
                  Effect: Allow
                  Action:
                    - ec2:Describe*
                  Resource: '*'
                - Sid: TaggingRead
                  Effect: Allow
                  Action:
                    - tag:Get*
                  Resource: '*'
                - Sid: ComputeDiscovery
                  Effect: Allow
                  Action:
                    - autoscaling:Describe*
                    - ecs:Describe*
                    - ecs:List*
                    - eks:Describe*
                    - eks:List*
                    - batch:Describe*
                    - batch:List*
                    - lambda:List*
                    # Not lambda:GetFunction: its result carries a presigned URL to the function's code.
                    - lambda:GetFunctionConfiguration
                  Resource: '*'
                - Sid: DatabaseDiscovery
                  Effect: Allow
                  Action:
                    - rds:Describe*
                    - rds:List*
                    - dynamodb:Describe*
                    - dynamodb:List*
                    - elasticache:Describe*
                    - elasticache:List*
                  Resource: '*'
                - Sid: StorageDiscovery
                  Effect: Allow
                  Action:
                    - s3:GetBucketLocation
                    - s3:GetBucketTagging
                    - s3:ListAllMyBuckets
                    - elasticfilesystem:DescribeFileSystems
                    - elasticfilesystem:DescribeTags
                  Resource: '*'
                - Sid: NetworkingDiscovery
                  Effect: Allow
                  Action:
                    - elasticloadbalancing:Describe*
                    - apigateway:GET
                    - route53:List*
                  Resource: '*'
                - Sid: MessagingDiscovery
                  Effect: Allow
                  Action:
                    - sqs:ListQueues
                    - sqs:GetQueueAttributes
                    - sns:List*
                    - sns:GetTopicAttributes
                    - kinesis:Describe*
                    - kinesis:List*
                    - firehose:Describe*
                    - firehose:List*
                  Resource: '*'
                - Sid: ApplicationServices
                  Effect: Allow
                  Action:
                    - states:DescribeStateMachine
                    - states:ListStateMachines
                    - events:List*
                    - events:Describe*
                  Resource: '*'
                - Sid: ManagementMonitoring
                  Effect: Allow
                  Action:
                    - cloudtrail:DescribeTrails
                    - cloudtrail:GetTrailStatus
                    - cloudtrail:ListTrails
                    - health:Describe*
                  Resource: '*'
                # Logs Insights, recent API activity, traces, deployment history from stack events, scaling, the
                # account alias and the enabled regions.
                - Sid: InvestigationReads
                  Effect: Allow
                  Action:
                    - logs:StartQuery
                    - logs:StopQuery
                    - cloudtrail:LookupEvents
                    - xray:Get*
                    - xray:BatchGetTraces
                    - cloudformation:Describe*
                    - cloudformation:List*
                    - application-autoscaling:Describe*
                    - iam:ListAccountAliases
                    - account:ListRegions
                  Resource: '*'
          - !Ref 'AWS::NoValue'
        - !If
          - DenyConfigurationValues
          - !Ref 'AWS::NoValue'
          - PolicyName: BetterStackAiSreBroadAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # Reads ReadOnlyAccess doesn't grant.
                - Sid: ReadsReadOnlyAccessLacks
                  Effect: Allow
                  Action:
                    - cloudtrail:StartQuery
                    - cloudtrail:CancelQuery
                    - logs:ListLogGroups
                    - pi:GetPerformanceAnalysisReport
                    - pi:ListPerformanceAnalysisReports
                  Resource: '*'
                # AWS's hosted MCP servers, read-only tools only. They act with this role's own permissions.
                - Sid: HostedMcpReadOnlyTools
                  Effect: Allow
                  Action:
                    - eks-mcp:InvokeMcp
                    - eks-mcp:CallReadOnlyTool
                    - ecs-mcp:UseMcp
                    - ecs-mcp:InvokeReadOnlyTools
                    - application-signals-mcp:InvokeMcp
                    - application-signals-mcp:CallReadOnlyTool
                  Resource: '*'
                # Reads of resources encrypted with a customer managed key, through these services only.
                - Sid: EncryptedInvestigationReads
                  Effect: Allow
                  Action:
                    - kms:Decrypt
                  Resource: '*'
                  Condition:
                    StringLike:
                      kms:ViaService:
                        - lambda.*.amazonaws.com
                        - s3.*.amazonaws.com
                        - xray.*.amazonaws.com
                        - rds.*.amazonaws.com
                        - states.*.amazonaws.com
                        - glue.*.amazonaws.com
        - !If
          - DenyConfigurationValues
          # Every read Better Stack knows returns environment variables, user data or parameter values.
          - PolicyName: BetterStackAiSreDenyConfigurationValues
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: DenyConfigurationValues
                  Effect: Deny
                  Action:
                    - lambda:ListFunctions
                    - lambda:ListVersionsByFunction
                    - lambda:GetFunctionConfiguration
                    - ecs:DescribeTaskDefinition
                    - ecs:DescribeTasks
                    - ecs:DescribeExpressGatewayService
                    - ecs:DescribeDaemonTaskDefinition
                    - batch:DescribeJobDefinitions
                    - batch:DescribeJobs
                    # A service job's request, such as a SageMaker training job's environment and hyperparameters.
                    - batch:DescribeServiceJob
                    - lambda:ListMicrovmImageVersions
                    - ec2:DescribeInstanceAttribute
                    - ec2:DescribeLaunchTemplateVersions
                    - ec2:DescribeSpotFleetRequests
                    - ec2:DescribeSpotInstanceRequests
                    - autoscaling:DescribeLaunchConfigurations
                    - cloudformation:DescribeStacks
                    - cloudformation:DescribeChangeSet
                    # A resource's Metadata (such as AWS::CloudFormation::Init), which NoEcho does not mask.
                    - cloudformation:DescribeStackResource
                    # Stack events carry each resource's properties, and exports carry output values.
                    - cloudformation:DescribeStackEvents
                    - cloudformation:DescribeEvents
                    - cloudformation:ListExports
                    # Drift results carry expected and actual property values, stack sets their parameters.
                    - cloudformation:DescribeStackResourceDrifts
                    - cloudformation:ListStackInstanceResourceDrifts
                    - cloudformation:DescribeStackSet
                    - cloudformation:DescribeStackInstance
                    # Cloud Control lists every resource of a type with its full properties, and resource requests
                    # carry the properties they set.
                    - cloudformation:ListResources
                    - cloudformation:ListResourceRequests
                    - eks:DescribeAddon
                    - events:ListTargetsByRule
                    - firehose:DescribeDeliveryStream
                  Resource: '*'
                - Sid: DenyStageVariables
                  Effect: Deny
                  Action:
                    - apigateway:GET
                  Resource:
                    - 'arn:aws:apigateway:*::/restapis/*/stages'
                    - 'arn:aws:apigateway:*::/restapis/*/stages/*'
                    - 'arn:aws:apigateway:*::/apis/*/stages'
                    - 'arn:aws:apigateway:*::/apis/*/stages/*'
          - !Ref 'AWS::NoValue'
      Tags:
        - Key: Solution
          Value: BetterStack
        # Read back by Better Stack to tell which release made the role. Never rename this key.
        - Key: BetterStackAiSreTemplateVersion
          Value: !FindInMap [Release, Current, Version]

  # Named like the role, from the external ID. Never change these names: an update would replace the policies.
  AiSreDenyDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Join ['', ['better-stack-ai-sre-deny-data-', !Select [3, !Split ['-', !Ref ExternalId]]]]
      Description: Better Stack AI SRE - denies secrets, credentials and data reads to the AI SRE role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyData
            Effect: Deny
            Action:
              - secretsmanager:GetSecretValue
              - ssm:GetParameter*
              - lambda:GetFunction
              - lambda:InvokeFunction
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:PartiQLSelect
              - dynamodb:GetRecords
              - sqs:ReceiveMessage
              - kinesis:GetRecords
              - kinesis:SubscribeToShard
              - ec2:GetPasswordData
              # Returns the tunnels' pre-shared keys.
              - ec2:DescribeVpnConnections
              - logs:Unmask
              # CloudWatch Omni's GetSpaceCredentials, GetSpaceCredentialsForOrganization and GetSpaceDataAccess hand
              # out temporary credentials of a space's own role, which these denies don't bind.
              - cloudwatch:GetSpace*
              # Can return rows of an Omni query someone else started, even one run with logs:Unmask; the role can't start queries.
              - cloudwatch:GetTelemetryQueryResults
              # Under xray:Get*, but reports sampling statistics and changes how X-Ray allocates the sampling quota.
              - xray:GetSamplingTargets
            Resource: '*'
          # Objects stay unreadable, except the logs AWS services deliver under an AWSLogs/ key (load balancer
          # access logs, VPC Flow Logs, CloudTrail). Access point and Object Lambda ARNs never match, so they stay denied.
          - Sid: DenyS3ObjectsOutsideAwsLogs
            Effect: Deny
            Action:
              - s3:GetObject*
            NotResource: !Sub 'arn:${AWS::Partition}:s3:::*/AWSLogs/*'
          - Sid: DenyCredentials
            Effect: Deny
            Action:
              - ecr:GetAuthorizationToken
              - ecr-public:GetAuthorizationToken
              - codeartifact:GetAuthorizationToken
              - connect:GetFederationToken
              - cognito-idp:ListUserPoolClientSecrets
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:GetClientToken
              - cognito-idp:GetTokensFromRefreshToken
              - cognito-idp:GetUserAttributeVerificationCode
              - cognito-identity:GetOpenIdToken*
              - wafv2:GetDecryptedAPIKey
              - wafv2:ListAPIKeys
              - appsync:ListApiKeys
              - storagegateway:DescribeChapCredentials
              - chime:ListVoiceConnectorTerminationCredentials
              - lightsail:GetBucketAccessKeys
              - lightsail:GetKeyPair*
              - lightsail:GetRelationalDatabaseMasterUserPassword
              - lightsail:GetInstanceAccessDetails
              - lightsail:DownloadDefaultKeyPair
              - gamelift:GetComputeAuthToken
              - gamelift:GetInstanceAccess
              - gamelift:GetComputeAccess
              - acm:GetAcmeExternalAccountBindingCredentials
              - ssm:GetAccessToken
              - license-manager:GetAccessToken
              - bedrock:CallWithBearerToken
              - bedrock-mantle:CallWithBearerToken
              - bedrock-agentcore:Get*CredentialProvider
              - s3express:CreateSession
              - secretsmanager:BatchGetSecretValue
              - redshift:GetClusterCredentials*
              - redshift-serverless:GetCredentials
              - ivs:GetStreamKey
              - ivs:BatchGetStreamKey
              - lakeformation:GetDataAccess
              - sns:GetSubscriptionAttributes
              - cognito-identity:GetCredentialsForIdentity
              - s3:GetDataAccess
              - athena:GetSessionEndpoint
              - emr-serverless:GetDashboardForJobRun
              - codepipeline:GetJobDetails
              - codepipeline:GetThirdPartyJobDetails
              - snowball:GetJobUnlockCode
              - snowball:GetJobManifest
              - cloudhsm:DescribeClusters
              - opsworks:DescribeApps
              - iotwireless:GetWirelessDevice
              - ec2:DescribeIpamExternalResourceVerificationTokens
              - ec2:DescribeVerifiedAccessTrustProviders
              - grafana:DescribeWorkspace
              - grafana:ListWorkspaces
              - kms:GetParametersForImport
              - lightsail:GetRelationalDatabase
              - lightsail:GetRelationalDatabases
              - rds:DescribeTenantDatabases
              # DMS endpoint passwords and the Directory Service RADIUS shared secret.
              - dms:DescribeEndpoints
              - ds:DescribeDirectories
              # Identity provider client secrets.
              - cognito-idp:DescribeIdentityProvider
              - cognito-idp:GetIdentityProviderByIdentifier
              - workspaces-web:GetIdentityProvider
              # Basic authentication, ingest passwords and stream keys.
              - amplify:GetApp
              - amplify:GetBranch
              - amplify:ListApps
              - amplify:ListBranches
              - mediapackage:DescribeChannel
              - mediapackage:ListChannels
              - ivs:GetChannel
              - ivs:BatchGetChannel
              - ivs:GetIngestConfiguration
              - ivs:GetStreamSession
              # Join, session and push tokens.
              - chime:GetAttendee
              - chime:ListAttendees
              - chime:GetBot
              - chime:ListBots
              - gamelift:GetPlayerConnectionDetails
              - gameliftstreams:GetStreamUrl
              - gameliftstreams:ListStreamUrls
              - mobiletargeting:GetBaiduChannel
              - mobiletargeting:GetGcmChannel
              - sns:GetEndpointAttributes
              - sns:ListEndpointsByPlatformApplication
              # Carry pre-shared or BGP keys, like ec2:DescribeVpnConnections above.
              - directconnect:DescribeVirtualInterfaces
              - directconnect:DescribeRouterConfiguration
              - interconnect:GetConnection
              - ec2:GetVpnConnectionDeviceSampleConfiguration
              - ec2:ExportClientVpnClientConfiguration
            Resource: '*'
          - Sid: DenyApiKeys
            Effect: Deny
            Action:
              - apigateway:GET
            Resource:
              - 'arn:aws:apigateway:*::/apikeys'
              - 'arn:aws:apigateway:*::/apikeys/*'
              # A usage plan's keys carry the same values.
              - 'arn:aws:apigateway:*::/usageplans/*/keys'
              - 'arn:aws:apigateway:*::/usageplans/*/keys/*'
          # kms:Decrypt only through the services AI SRE reads encrypted resources with. Lambda decrypts a
          # function's environment as the caller, so without it no function's environment variables would be
          # readable. In restricted mode only the CloudWatch Logs allow reaches a key, so the others stay unreadable
          # there unless a key policy names the role.
          - Sid: DenyKmsOutsideNamedServices
            Effect: Deny
            Action:
              - kms:Decrypt
            Resource: '*'
            Condition:
              StringNotLike:
                kms:ViaService:
                  - logs.*.amazonaws.com
                  - lambda.*.amazonaws.com
                  - s3.*.amazonaws.com
                  - xray.*.amazonaws.com
                  - rds.*.amazonaws.com
                  - states.*.amazonaws.com
                  - glue.*.amazonaws.com

  AiSreDenyStoredDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Join ['', ['better-stack-ai-sre-deny-stored-data-', !Select [3, !Split ['-', !Ref ExternalId]]]]
      Description: Better Stack AI SRE - denies reads of stored content, end users and code to the AI SRE role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyStoredData
            Effect: Deny
            Action:
              - athena:GetQueryResults*
              - cassandra:Select
              - dax:GetItem
              - dax:BatchGetItem
              - dax:Query
              - dax:Scan
              - dynamodb:ReadDataForReplication
              - qldb:GetBlock
              - qldb:GetRevision
              - sdb:Select
              - sdb:GetAttributes
              - timestream:Select
              - redshift-data:GetStatementResult*
              - glacier:GetJobOutput
              - mediastore:GetObject
              - s3-object-lambda:GetObject*
              - s3vectors:GetVectors
              - s3vectors:QueryVectors
              - s3tables:GetTableData
              - ebs:GetSnapshotBlock
              - ebs:ListSnapshotBlocks
              - es:ESHttp*
              - aoss:APIAccessAll
              - aoss:DashboardsAccessAll
              - kinesisvideo:Get*
              - healthlake:ReadResource
              - healthlake:Search*
              - healthlake:GetHistoryByResourceId
              - medical-imaging:GetImageFrame
              - medical-imaging:GetImageSetMetadata
              - omics:GetReadSet
              - iot:GetThingShadow
              - iotsitewise:Get*Property*
              - iotanalytics:GetDatasetContent
              - iotanalytics:SampleChannelData
              - sagemaker:GetRecord
              - sagemaker:BatchGetRecord
              - bedrock:GetAgentMemory
              - bedrock:Retrieve
              - bedrock:AgenticRetrieveStream
              - bedrock:GetDocumentContent
              - bedrock-agentcore:GetMemoryRecord
              - bedrock-agentcore:RetrieveMemoryRecords
              - bedrock-agentcore:ListMemoryRecords
              - bedrock-agentcore:GetEvent
              - bedrock-agentcore:ListEvents
              - workdocs:GetDocument*
              - chime:GetChannelMessage
              - chime:ListChannelMessages
              - aidevops:ListJournalRecords
              - aidevops:ListPendingMessages
              - bedrock:GetInvocationStep
              - bedrock:ListFlowExecutionEvents
              - clouddirectory:BatchRead
              - clouddirectory:GetLinkAttributes
              - clouddirectory:GetObjectAttributes
              - clouddirectory:ListAttachedIndices
              - clouddirectory:ListIncomingTypedLinks
              - clouddirectory:ListIndex
              - clouddirectory:ListObjectAttributes
              - clouddirectory:ListOutgoingTypedLinks
              - cloudfront-keyvaluestore:GetKey
              - cloudfront-keyvaluestore:ListKeys
              - dataexchange:GetAsset
              - dataexchange:GetJob
              - dataexchange:ListJobs
              - dataexchange:ListRevisionAssets
              - dynamodb:SearchVectors
              - ec2:DescribeConversionTasks
              - forecast:QueryForecast
              - forecast:QueryWhatIfForecast
              - frauddetector:GetEvent
              - frauddetector:GetEventPredictionMetadata
              - glue:GetStatement
              - glue:ListStatements
              - importexport:GetStatus
              - iot:GetRetainedMessage
              - iot:GetTopicRule
              - iotsitewise:GetCaptureData
              - iotsitewise:GetQueryResults
              - kendra:Query
              - kendra:GetQuerySuggestions
              - kinesisanalytics:DiscoverInputSchema
              - lookoutmetrics:GetSampleData
              - mediapackagev2:GetObject
              - omics:GetReference
              - personalize:GetPersonalizedRanking
              - personalize:GetRecommendations
              - rekognition:GetTextDetection
              - s3-outposts:GetObject
              - s3-outposts:GetObjectVersion
              - s3-outposts:GetObjectVersionForReplication
              - securityagent:GetArtifact
              - ses:GetArchiveMessage
              - ses:GetArchiveMessageContent
              - ses:GetArchiveSearchResults
              - support:DescribeAttachment
              - tax:GetTaxRegistrationDocument
              - transcribe:GetCallAnalyticsJob
              - transcribe:GetTranscriptionJob
              - translate:GetParallelData
              - translate:GetTerminology
              - workdocs:DescribeComments
              - workdocs:DescribeDocumentVersions
              - medialive:DescribeInputDeviceThumbnail
              # Payloads of Lambda durable executions.
              - lambda:GetDurableExecution
              - lambda:GetDurableExecutionHistory
